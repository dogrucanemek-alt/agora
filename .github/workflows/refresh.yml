name: refresh data

# Daily: read the registry, GitHub signals and the handshake check again, publish the result as the
# "data-latest" release, keep the day's result in "data-history", and rebuild the site from it.
# The PyPI download query costs money per run, so it runs on Mondays only; the other days carry
# Monday's counts forward with the date they were read.

on:
  schedule:
    - cron: "17 3 * * *" # every day 03:17 UTC
  workflow_dispatch:
    inputs:
      pypi_downloads:
        description: "Run the PyPI download query (billed) in this run"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # keyless Google sign-in for the BigQuery PyPI download query

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UV_THREADPOOL_SIZE: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: last published facts (for the sanity check)
        run: gh release download data-latest --pattern facts.json --output previous-facts.json || echo '{}' > previous-facts.json

      - run: npm run catalog
      - run: node scripts/github.mjs

      # The last published package snapshot supplies PyPI counts on the days the query does not run.
      # With no snapshot to carry from, the query runs whatever the day is.
      - name: decide whether the PyPI download query runs today
        id: plan
        env:
          ASKED: ${{ inputs.pypi_downloads }}
          EVENT: ${{ github.event_name }}
        run: |
          gh release download data-latest --pattern packages.json --output data/packages.previous.json || rm -f data/packages.previous.json
          query=false
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; then query=true; fi
          if [ "$ASKED" = "true" ]; then query=true; fi
          if [ ! -s data/packages.previous.json ]; then query=true; fi
          echo "query=$query" >> "$GITHUB_OUTPUT"
          echo "PyPI download query today: $query"

      # Workload Identity Federation: no stored key. Only this repository may use the service
      # account, and it can only run BigQuery jobs. If sign-in fails, PyPI counts are carried or stay unknown.
      - name: Google sign-in for PyPI download counts
        id: gcp
        if: steps.plan.outputs.query == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/146489802611/locations/global/workloadIdentityPools/github/providers/agora
          service_account: agora-pypi-downloads@project-4869c97c-9f9c-4001-937.iam.gserviceaccount.com
          project_id: project-4869c97c-9f9c-4001-937
      - run: node scripts/packages.mjs
      - run: node scripts/probe.mjs --fresh
      - run: node scripts/probe.mjs --retry
      - run: node scripts/probe.mjs --retry
      - run: node scripts/build-index.mjs
      - run: npm test

      - name: refuse a run that looks like our own network failing
        run: |
          node -e '
            const prev = require("./previous-facts.json"), next = require("./data/facts.json");
            const a = prev.probe?.answered, b = next.probe.answered;
            console.log(`answered: previous ${a ?? "none"}, now ${b}`);
            if (a && b < a * 0.7) { console.error("answered dropped by more than 30%; not publishing"); process.exit(1); }
            if (next.servers < 1000) { console.error("catalog looks empty; not publishing"); process.exit(1); }
          '

      - name: publish data-latest
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Data (latest)" --notes "Measurements behind openforallofus.com. Replaced on every refresh. CC BY 4.0." --latest=false
          gh release upload data-latest data/index.json data/facts.json data/packages.json --clobber

      - name: rebuild the site
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "no deploy hook configured"; exit 1; fi
          # The hook can answer 429 (seen 12 Oct 2026); wait and try again instead of failing the run.
          curl -fsS --retry 6 --retry-delay 90 -X POST "$HOOK" > /dev/null

      - name: tell IndexNow
        run: node scripts/indexnow.mjs || echo "IndexNow ping failed; the next run will try again"

      # Last, so a problem here cannot hold back the site; it still fails the run, so it gets seen.
      - name: keep today's result in data-history
        run: |
          node scripts/history.mjs
          gh release view data-history >/dev/null 2>&1 || gh release create data-history --title "Data (history)" --notes "One file per check day: the handshake class of every server with a remote endpoint. CC BY 4.0." --latest=false
          gh release upload data-history data/history/status-*.json.gz --clobber
